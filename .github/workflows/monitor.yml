# Spark Mobile 알림 점검 스케줄러
# PC나 Claude 앱이 꺼져 있어도 GitHub 서버에서 10분마다 /monitor 를 호출한다.
# (도선예보 등록·변경 알림 + 도선 임박 알림 판단이 모두 /monitor 안에서 이뤄짐)
# 10분 간격: 도선사회 사이트에 부담을 덜 주면서, Render 무료 서버가 잠드는 기준(15분)보다
# 짧아 서버도 계속 깨어 있다 (AIS 위치 캐시도 계속 쌓임).
name: Monitor targets

on:
  schedule:
    - cron: "*/10 * * * *"  # 10분마다 (GitHub 사정에 따라 몇 분씩 늦어질 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Call /monitor
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w "%{http_code}" -X POST --max-time 240 \
              https://spark-api-1.onrender.com/monitor || true)
            if [ "$code" = "200" ]; then
              cat out.json
              exit 0
            fi
            echo "attempt $i failed: HTTP $code"
            sleep 20
          done
          exit 1
